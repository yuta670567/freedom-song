<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Song</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f4f5f7;
  color: #202124;
}

header {
  background: white;
  text-align: center;
  padding: 26px 15px 22px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 7px 0 0;
  color: #777;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 24px 18px 50px;
}

.section-title {
  text-align: center;
  margin: 18px 0 15px;
  font-size: 22px;
}

.help {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

.chords {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.chord {
  background: white;
  border: 0;
  border-radius: 18px;
  padding: 20px 5px 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  touch-action: manipulation;
}

.chord:active {
  transform: scale(.96);
}

.chord-name {
  display: block;
  font-size: 27px;
  font-weight: 750;
  color: #3478f6;
}

.role {
  display: block;
  font-size: 11px;
  color: #888;
  margin-top: 5px;
}

.builder {
  background: white;
  margin-top: 30px;
  padding: 20px;
  border-radius: 22px;
  box-shadow: 0 4px 14px rgba(0,0,0,.06);
}

.progression {
  min-height: 76px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 10px 0 18px;
}

.empty {
  color: #aaa;
  font-size: 15px;
}

.step {
  display: flex;
  align-items: center;
  gap: 7px;
}

.step-code {
  min-width: 48px;
  padding: 10px 11px;
  border-radius: 12px;
  background: #eef3ff;
  color: #3478f6;
  font-weight: 750;
  font-size: 20px;
  text-align: center;
  transition: .15s;
}

.step-code.playing {
  background: #3478f6;
  color: white;
  transform: scale(1.1);
}

.arrow {
  color: #999;
  font-size: 18px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.small-button {
  border: 0;
  background: #eeeeef;
  border-radius: 13px;
  padding: 13px;
  font-size: 15px;
}

.play {
  grid-column: 1 / -1;
  border: 0;
  background: #202124;
  color: white;
  border-radius: 15px;
  padding: 17px;
  font-size: 19px;
  font-weight: 650;
}

.play:active {
  transform: scale(.98);
}

.tempo-box {
  margin-top: 20px;
  padding-top: 17px;
  border-top: 1px solid #eee;
}

.tempo-label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 14px;
  color: #666;
}

input[type=range] {
  width: 100%;
}

.explanation {
  margin-top: 25px;
  background: #eaf2ff;
  border-radius: 18px;
  padding: 18px;
}

.explanation-title {
  font-weight: 700;
  margin-bottom: 7px;
}

#meaning {
  line-height: 1.6;
  color: #555;
  font-size: 14px;
}

.tip {
  margin-top: 25px;
  text-align: center;
  color: #777;
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>

<body>

<header>
  <h1>Freedom Song</h1>
  <p>コード進行を、耳で遊ぼう。</p>
</header>

<main>

  <div class="section-title">① コードを選ぶ</div>
  <div class="help">押すたびに下のコード進行へ追加されます</div>

  <div class="chords">

    <button class="chord" onclick="addChord('C')">
      <span class="chord-name">C</span>
      <span class="role">帰ってきた感じ</span>
    </button>

    <button class="chord" onclick="addChord('Dm')">
      <span class="chord-name">Dm</span>
      <span class="role">少し切ない</span>
    </button>

    <button class="chord" onclick="addChord('Em')">
      <span class="chord-name">Em</span>
      <span class="role">静かな陰り</span>
    </button>

    <button class="chord" onclick="addChord('F')">
      <span class="chord-name">F</span>
      <span class="role">広がる感じ</span>
    </button>

    <button class="chord" onclick="addChord('G')">
      <span class="chord-name">G</span>
      <span class="role">Cへ進みたがる</span>
    </button>

    <button class="chord" onclick="addChord('Am')">
      <span class="chord-name">Am</span>
      <span class="role">切ない安定</span>
    </button>

  </div>

  <div class="builder">

    <div class="section-title">② 自分のコード進行</div>

    <div class="progression" id="progression">
      <span class="empty">上のコードを押してみよう</span>
    </div>

    <div class="controls">

      <button class="small-button" onclick="undoChord()">
        ↩ 1つ戻す
      </button>

      <button class="small-button" onclick="clearProgression()">
        クリア
      </button>

      <button class="play" id="playButton" onclick="playProgression()">
        ▶ 最初から聴く
      </button>

    </div>

    <div class="tempo-box">
      <div class="tempo-label">
        <span>テンポ</span>
        <strong><span id="bpmValue">90</span> BPM</strong>
      </div>

      <input
        id="tempo"
        type="range"
        min="50"
        max="160"
        value="90"
        oninput="updateTempo()"
      >
    </div>

  </div>

  <div class="explanation">
    <div class="explanation-title">🎧 今のコード</div>
    <div id="meaning">
      コードを押すと、そのコードの感じをここに表示します。
    </div>
  </div>

  <div class="tip">
    まずは<br>
    <strong>C → G → Am → F</strong><br>
    を作って聴いてみよう。<br><br>
    そのあと順番を変えると、曲の印象がどう変わる？
  </div>

</main>

<script>

const chordData = {
  C: {
    notes: [261.63, 329.63, 392.00, 523.25],
    text: "Cは「家」のようなコード。ここに来ると、落ち着いたり終わった感じがしやすい。"
  },

  Dm: {
    notes: [293.66, 349.23, 440.00, 587.33],
    text: "Dmは少し切なさを持ちながら、次へ動いていく感じを作りやすい。"
  },

  Em: {
    notes: [329.63, 392.00, 493.88, 659.25],
    text: "Emは暗すぎない陰り。流れの途中に入れると、少し景色が変わる。"
  },

  F: {
    notes: [349.23, 440.00, 523.25, 698.46],
    text: "Fは景色が広がるような感じ。CからFへ行くと、少し外へ出たように感じやすい。"
  },

  G: {
    notes: [392.00, 493.88, 587.33, 783.99],
    text: "Gは『まだ終われない』感じが強いコード。GのあとにCを鳴らすと、帰ってきた感覚を比べやすい。"
  },

  Am: {
    notes: [220.00, 261.63, 329.63, 440.00],
    text: "Amは切なさがありながら比較的落ち着くコード。Cとは違う種類の安定感がある。"
  }
};

let progression = [];
let audioContext = null;
let isPlaying = false;

async function prepareAudio() {

  if (!audioContext) {
    audioContext =
      new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  return audioContext;
}

async function soundChord(name, duration = 1.2) {

  const ctx = await prepareAudio();

  const start = ctx.currentTime;
  const master = ctx.createGain();

  master.gain.setValueAtTime(0.0001, start);
  master.gain.exponentialRampToValueAtTime(0.7, start + 0.015);
  master.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  master.connect(ctx.destination);

  chordData[name].notes.forEach((frequency, index) => {

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(frequency, start);

    gain.gain.value = 0.07 / (1 + index * 0.08);

    osc.connect(gain);
    gain.connect(master);

    osc.start(start);
    osc.stop(start + duration + 0.05);
  });
}

async function addChord(name) {

  await prepareAudio();

  soundChord(name, 0.9);

  document.getElementById("meaning").textContent =
    chordData[name].text;

  if (progression.length >= 8) {
    return;
  }

  progression.push(name);
  renderProgression();
}

function renderProgression(activeIndex = -1) {

  const box = document.getElementById("progression");

  if (progression.length === 0) {
    box.innerHTML =
      '<span class="empty">上のコードを押してみよう</span>';
    return;
  }

  box.innerHTML = "";

  progression.forEach((name, index) => {

    const step = document.createElement("div");
    step.className = "step";

    const code = document.createElement("div");
    code.className =
      "step-code" + (index === activeIndex ? " playing" : "");

    code.textContent = name;

    step.appendChild(code);

    if (index < progression.length - 1) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "→";
      step.appendChild(arrow);
    }

    box.appendChild(step);
  });
}

function undoChord() {

  if (isPlaying) return;

  progression.pop();
  renderProgression();
}

function clearProgression() {

  if (isPlaying) return;

  progression = [];
  renderProgression();

  document.getElementById("meaning").textContent =
    "コードを押すと、そのコードの感じをここに表示します。";
}

function updateTempo() {

  document.getElementById("bpmValue").textContent =
    document.getElementById("tempo").value;
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playProgression() {

  if (isPlaying || progression.length === 0) return;

  await prepareAudio();

  isPlaying = true;

  const button = document.getElementById("playButton");
  button.textContent = "再生中…";

  const bpm =
    Number(document.getElementById("tempo").value);

  const beat = 60000 / bpm;

  for (let i = 0; i < progression.length; i++) {

    const name = progression[i];

    renderProgression(i);

    document.getElementById("meaning").textContent =
      name + "： " + chordData[name].text;

    await soundChord(name, beat / 1000 * 0.9);
    await wait(beat);
  }

  renderProgression();

  button.textContent = "▶ 最初から聴く";

  isPlaying = false;
}

</script>

</body>
</html>

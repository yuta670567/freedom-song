<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Song</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #f5f5f7;
  color: #222;
  text-align: center;
}

header {
  background: white;
  padding: 22px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-top: 30px;
}

.chords {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.chord {
  border: none;
  border-radius: 18px;
  background: white;
  padding: 25px 5px;
  font-size: 26px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,.1);
}

.chord:active {
  transform: scale(.95);
  background: #e8e8ed;
}

.progression {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 15px;
}

.progression-display {
  font-size: 24px;
  font-weight: bold;
  margin: 15px 0;
}

.play {
  width: 100%;
  border: none;
  border-radius: 15px;
  background: #222;
  color: white;
  padding: 16px;
  font-size: 18px;
}

.now {
  margin-top: 18px;
  min-height: 40px;
  font-size: 28px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Freedom Song</h1>
  <div class="subtitle">コードを押して、響きを感じよう</div>
</header>

<main>

<h2>コード</h2>

<div class="chords">
  <button class="chord" onclick="playChord('C')">C</button>
  <button class="chord" onclick="playChord('Dm')">Dm</button>
  <button class="chord" onclick="playChord('Em')">Em</button>
  <button class="chord" onclick="playChord('F')">F</button>
  <button class="chord" onclick="playChord('G')">G</button>
  <button class="chord" onclick="playChord('Am')">Am</button>
</div>

<div class="now" id="now"></div>

<h2>コード進行を聴く</h2>

<div class="progression">
  <div class="progression-display">
    C → Am → G → F
  </div>

  <button class="play" onclick="playProgression()">
    ▶ 再生
  </button>
</div>

</main>

<script>

const chords = {
  C:  [261.63, 329.63, 392.00],
  Dm: [293.66, 349.23, 440.00],
  Em: [329.63, 392.00, 493.88],
  F:  [349.23, 440.00, 523.25],
  G:  [392.00, 493.88, 587.33],
  Am: [440.00, 523.25, 659.25]
};

let audioContext;

function getAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext ||
                        window.webkitAudioContext)();
  }
  return audioContext;
}

function playChord(name, duration = 1.3) {

  const ctx = getAudioContext();
  const now = ctx.currentTime;

  document.getElementById("now").textContent = name;

  chords[name].forEach(freq => {

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.15, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + duration
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + duration);
  });
}

async function playProgression() {

  const progression = ["C", "Am", "G", "F"];

  for (const chord of progression) {

    playChord(chord, 1.4);

    await new Promise(resolve =>
      setTimeout(resolve, 1500)
    );
  }

  document.getElementById("now").textContent = "";
}

</script>

</body>
</html>
